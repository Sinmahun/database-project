
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>Stock Management</h1>
    </div>
  </header>

  <main class="container">

    <section class="panel">
      <h2>เพิ่มสินค้าใหม่</h2>

      <form id="productForm">
        <div class="form-grid">
          <div class="field">
            <label for="code">รหัสสินค้า</label>
            <input id="code" name="code"
              placeholder="เช่น P003" required />
          </div>

          <div class="field">
            <label for="name">ชื่อสินค้า</label>
            <input id="name" name="name"
              placeholder="กรอกชื่อสินค้า" required />
          </div>

          <div class="field">
            <label for="price">ราคา (บาท)</label>
            <input id="price" name="price" type="number"
              min="0" step="0.01" placeholder="0.00" required />
          </div>

          <div class="field">
            <label for="quantity">จำนวนสินค้า</label>
            <input id="quantity" name="quantity" type="number"
              min="0" step="1" placeholder="0" required />
          </div>
        </div>

        <button type="submit" id="submitButton">
          + เพิ่มสินค้า
        </button>
      </form>

      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <div class="table-heading">
        <div>
          <h2>รายการสินค้าทั้งหมด</h2>
          <p>ข้อมูลจากฐานข้อมูล MongoDB</p>
        </div>
        <button class="secondary" id="refreshButton" type="button">
          รีเฟรช
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>รหัสสินค้า</th>
              <th>ชื่อสินค้า</th>
              <th>ราคา</th>
              <th>จำนวน</th>
              <th>มูลค่ารวม</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="productList">
            <tr>
              <td colspan="6" class="empty">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
